    <script>
      // Circular structure protection
      (function() {
        var origStringify = JSON.stringify;
        JSON.stringify = function(value, replacer, space) {
          try {
            return origStringify(value, replacer, space);
          } catch (err) {
            if (err && (err.message || '').indexOf('circular') !== -1) {
              var seen = new WeakSet();
              return origStringify(value, function(k, v) {
                if (typeof v === 'object' && v !== null) {
                  if (seen.has(v)) return '[Circular]';
                  seen.add(v);
                }
                if (typeof replacer === 'function') return replacer.call(this, k, v);
                return v;
              }, space);
            }
            throw err;
          }
        };
      })();
    </script>
